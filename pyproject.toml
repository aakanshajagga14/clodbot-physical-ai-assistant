[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clodbot"
version = "0.1.0"
description = "Predictive physical AI for industrial worker safety"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]
cyberwave = ["cyberwave @ git+https://github.com/cyberwave-os/cyberwave-python.git"]

[project.scripts]
clodbot-demo = "clodbot.cli:main"

[tool.setuptools.packages.find]
include = ["clodbot*"]

[tool.setuptools.package-data]
clodbot = ["safety/rules/*.yaml", "procedures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
